<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style/bootstrap.css" />
    <link rel="stylesheet" href="/style/index.css" />
    <title>Document</title>
  </head>
  <body>
    <div
      class="text-center container-fluid d-flex flex-column align-items-center justify-content-center vh-100 bg-light"
    >
      <div class="bg-dark rounded-circle"></div>
      <div class>
        <h1>GitHub User Finder</h1>
      </div>
      <div class>
        <p>Search for any GitHub user by their username</p>
      </div>
      <div
        class="d-flex justify-content-center bg-white shadow p-3 rounded-4 w-50"
      >
        <div class="w-100">
          <input
            placeholder="Enter GitHub username..."
            type="text"
            class="w-75"
          />
          <button class="btn btn-primary px-4">show</button>
        </div>
      </div>
      <div class="result w-50 bg-dark rounded-4 m-3 text-light"></div>
      <div class="error bg-dark text-light w-50 rounded-4"></div>
    </div>

    <script src="/index.js"></script>
  </body>
</html>
